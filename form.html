<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申し込み完了 | イチバンデシ</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-XXXXXXXXXX');
  gtag('event', 'conversion', {'send_to': 'AW-XXXXXXXXXX/XXXXXXXXXX'});
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F2F4F2; --white:#FFFFFF;
    --accent:#2A7A45; --accent2:#E8F5EC;
    --text:#1A2A1F; --muted:#6B7F70;
    --border:#C8D9CC; --shadow:rgba(42,122,69,0.10);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Noto Sans JP',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
  }

  nav {
    padding:0 5vw; height:64px;
    display:flex; justify-content:space-between; align-items:center;
    background:var(--white); border-bottom:1px solid var(--border);
    box-shadow:0 1px 8px rgba(0,0,0,0.06);
  }
  .nav-logo { font-weight:900; font-size:26px; letter-spacing:0.05em; color:var(--text); text-decoration:none; }
  .nav-logo span { color:var(--accent); }

  main {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:60px 5vw;
  }

  .inner {
    max-width:520px; width:100%; text-align:center;
  }

  .check-wrap {
    width:80px; height:80px; border-radius:50%;
    background:var(--accent2); border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 32px;
    animation:popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both;
  }
  @keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

  h1 {
    font-weight:900; font-size:clamp(26px,4vw,40px);
    line-height:1.25; margin-bottom:14px; color:var(--text);
    animation:fadeUp 0.6s 0.2s ease both;
  }
  h1 span { color:var(--accent); }

  .sub {
    font-size:15px; color:var(--muted); line-height:1.9;
    margin-bottom:40px;
    animation:fadeUp 0.6s 0.3s ease both;
  }

  .next-steps {
    background:var(--white); border:1px solid var(--border);
    border-radius:10px; padding:28px 28px; text-align:left;
    margin-bottom:36px;
    animation:fadeUp 0.6s 0.35s ease both;
  }
  .next-title {
    font-size:11px; font-weight:700; letter-spacing:0.3em;
    color:var(--accent); text-transform:uppercase; margin-bottom:18px;
  }
  .next-list { list-style:none; display:flex; flex-direction:column; gap:14px; }
  .next-list li {
    display:flex; align-items:flex-start; gap:14px;
    font-size:14px; line-height:1.7; color:var(--text);
  }
  .next-num {
    width:28px; height:28px; border-radius:50%;
    background:var(--accent2); border:1px solid rgba(42,122,69,0.3);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue',sans-serif; font-size:14px;
    color:var(--accent); flex-shrink:0;
  }

  .btn-back {
    display:inline-block; background:var(--accent); color:#fff;
    font-weight:700; font-size:15px; padding:16px 40px;
    text-decoration:none; letter-spacing:0.06em; border-radius:6px;
    transition:background 0.15s, transform 0.15s;
    box-shadow:0 4px 14px var(--shadow);
    animation:fadeUp 0.6s 0.45s ease both;
  }
  .btn-back:hover { background:#3A9B58; transform:translateY(-1px); }

  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  footer {
    background:var(--text); padding:32px 5vw;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  .footer-logo { font-weight:900; font-size:17px; color:#fff; text-decoration:none; }
  .footer-logo span { color:var(--accent); }
  footer p { font-size:12px; color:rgba(255,255,255,0.3); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">イチバン<span>デシ</span></a>
</nav>

<main>
  <div class="inner">
    <div class="check-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2A7A45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1>申し込みを<br><span>受け付けました。</span></h1>
    <p class="sub">
      ご入力いただいたメールアドレス・電話番号に<br>
      担当者より<strong style="color:var(--text)">1営業日以内</strong>にご連絡いたします。
    </p>

    <div class="next-steps">
      <div class="next-title">次のステップ</div>
      <ul class="next-list">
        <li>
          <div class="next-num">1</div>
          <span>担当者からご連絡し、アプリのアクセス情報をお送りします</span>
        </li>
        <li>
          <div class="next-num">2</div>
          <span>初期設定代行を希望された方は、単価リスト・顧客情報・会社印データをご用意ください</span>
        </li>
        <li>
          <div class="next-num">3</div>
          <span>セットアップ完了後、30日間の無料トライアル開始です</span>
        </li>
      </ul>
    </div>

    <a href="index.html" class="btn-back">トップページに戻る</a>
  </div>
</main>

<footer>
  <a href="index.html" class="footer-logo">イチバン<span>デシ</span></a>
  <p>© 2025 SANPO ENGINE. イチバンデシ.</p>
</footer>

</body>
</html>
