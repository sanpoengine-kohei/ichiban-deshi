<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申し込み完了 | イチバンデシ</title>
<!-- Google広告コンバージョン計測用 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-XXXXXXXXXX');
  // コンバージョンイベント（Google広告の管理画面で発行されたIDに差し替えてください）
  gtag('event', 'conversion', {'send_to': 'AW-XXXXXXXXXX/XXXXXXXXXX'});
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0D120E; --accent:#4CAF65; --white:#EDF2EE;
    --muted:rgba(237,242,238,0.45); --border:rgba(76,175,101,0.18);
    --card:#141C14;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans JP',sans-serif; background:var(--bg); color:var(--white); min-height:100vh; display:flex; flex-direction:column; }

  nav {
    padding:16px 5vw; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--border);
  }
  .nav-logo { font-weight:900; font-size:19px; letter-spacing:0.06em; color:var(--white); text-decoration:none; }
  .nav-logo span { color:var(--accent); }

  main {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:60px 5vw; text-align:center;
    position:relative; overflow:hidden;
  }
  main::before {
    content:''; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:600px; height:600px;
    background:radial-gradient(circle, rgba(46,107,62,0.15) 0%, transparent 70%);
    pointer-events:none;
  }

  .inner { position:relative; max-width:560px; }

  .check-icon {
    width:80px; height:80px; border-radius:50%;
    background:rgba(76,175,101,0.12); border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 32px;
    font-size:36px;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }
  @keyframes popIn {
    from { transform:scale(0); opacity:0; }
    to   { transform:scale(1); opacity:1; }
  }

  h1 {
    font-weight:900; font-size:clamp(28px,4vw,44px);
    line-height:1.2; margin-bottom:16px;
    animation: fadeUp 0.6s 0.2s ease both;
  }
  h1 span { color:var(--accent); }

  .sub {
    font-size:15px; color:var(--muted); line-height:1.9;
    margin-bottom:48px;
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .next-steps {
    background:var(--card); border:1px solid var(--border);
    padding:28px 32px; text-align:left; margin-bottom:40px;
    animation: fadeUp 0.6s 0.4s ease both;
  }
  .next-title {
    font-size:11px; font-weight:700; letter-spacing:0.3em;
    color:var(--accent); text-transform:uppercase; margin-bottom:20px;
  }
  .next-list { list-style:none; display:flex; flex-direction:column; gap:14px; }
  .next-list li { display:flex; align-items:flex-start; gap:12px; font-size:13px; line-height:1.7; }
  .next-num {
    font-family:'Bebas Neue',sans-serif; font-size:20px;
    color:var(--accent); flex-shrink:0; line-height:1.1;
  }

  .btn-back {
    display:inline-block; background:var(--accent); color:#0D120E;
    font-weight:700; font-size:14px; padding:16px 40px;
    text-decoration:none; letter-spacing:0.08em;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
    transition:opacity 0.15s;
    animation: fadeUp 0.6s 0.5s ease both;
  }
  .btn-back:hover { opacity:0.85; }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }

  footer {
    border-top:1px solid rgba(76,175,101,0.08); padding:28px 5vw;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  footer p { font-size:12px; color:rgba(237,242,238,0.22); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">イチバン<span>デシ</span></a>
</nav>

<main>
  <div class="inner">
    <div class="check-icon">✅</div>
    <h1>申し込みを<br><span>受け付けました。</span></h1>
    <p class="sub">
      ご入力いただいたメールアドレス・電話番号に<br>
      担当者より<strong style="color:var(--white)">1営業日以内</strong>にご連絡いたします。
    </p>
    <div class="next-steps">
      <div class="next-title">次のステップ</div>
      <ul class="next-list">
        <li><span class="next-num">01</span><span>担当者からご連絡し、アプリのアクセス情報をお送りします</span></li>
        <li><span class="next-num">02</span><span>初期設定代行を希望された方は、単価リスト・顧客情報・会社印データをご用意ください</span></li>
        <li><span class="next-num">03</span><span>セットアップ完了後、30日間の無料トライアル開始です</span></li>
      </ul>
    </div>
    <a href="index.html" class="btn-back">トップページに戻る</a>
  </div>
</main>

<footer>
  <a href="index.html" class="nav-logo" style="font-size:16px">イチバン<span>デシ</span></a>
  <p>© 2025 SANPO ENGINE. イチバンデシ — 一人親方のための仕事管理アプリ.</p>
</footer>

</body>
</html>
